<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik&display=swap"
      rel="stylesheet"
    />
    <title>Rocketseat - React.js - Fundamentos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              text: "#EBEBEB",
              "text-secondary": "#6B6B6B",
              primary: "#462878",
              background: "#2D2A37",
            },
            fontFamily: {
              sans: ["Rubik", "sans-serif"],
            },
            boxShadow: {
              custom:
                "0px 11px 7px 0px rgba(0, 0, 0, 0.01), 0px 7px 7px 0px rgba(0, 0, 0, 0.04), 0px 4px 6px 0px rgba(0, 0, 0, 0.10), 0px 2px 4px 0px rgba(0, 0, 0, 0.26), 0px 0px 2px 0px rgba(0, 0, 0, 0.29), inset 0px 2px 3px 0px rgba(255, 255, 255, 0.06)",
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #1a1825;
      }
    </style>
  </head>
  <body class="bg-linear min-h-screen text-text font-sans">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const textVariants = {
        default: "text-xl",
        muted: "text-xl text-text-secondary",
        heading: "text-2xl",
        blast: "text-3xl",
      };

      function Text({
        as = "span",
        variant = "default",
        className = "",
        children,
        ...props
      }) {
        return React.createElement(
          as,
          {
            className: `${textVariants[variant]} ${className}`,
            ...props,
          },
          children,
        );
      }

      const buttonVariants = {
        default: "bg-background",
        primary: "bg-primary",
      };

      function Button({
        variant = "default",
        children,
        className = "",
        ...props
      }) {
        return (
          <Text
            as="button"
            variant="heading"
            className={`
                        flex items-center justify-center rounded-xl
                        p-3 cursor-pointer text-text
                        shadow-custom
                        transition-all hover:brightness-110
                        ${buttonVariants[variant]}
                        ${className}
                    `}
            {...props}
          >
            {children}
          </Text>
        );
      }

      function Card({ children, className = "", ...props }) {
        return (
          <div
            className={`
                        bg-background 
                        shadow-custom
                        rounded-2xl
                        ${className}
                    `}
            {...props}
          >
            {children}
          </div>
        );
      }

      const buttons = [
        [
          { input: "CE" },
          { input: "C", className: "flex-1 h-16" },
          { input: "/", variant: "primary" },
        ],
        [
          { input: "7" },
          { input: "8" },
          { input: "9" },
          { input: "*", variant: "primary" },
        ],
        [
          { input: "4" }, 
          { input: "5" }, 
          { input: "6" },
          { input: "-", variant: "primary" }
        ],
        [
          { input: "1" }, 
          { input: "2" }, 
          { input: "3" }, 
          { input: "+", variant: "primary" }, 
        ],
        [
          { input: "0", className: "flex-1 h-16" }, 
          { input: "," }, 
          { input: "=", className: "w-16 h-16 bg-[#7F45E2]" }, 
        ]
      ];

      function CalculatorDisplay({ operation, result }) {
        return (
          <div
            className={`
                        flex flex-col gap-2 px-[1.375rem]
                        cursor-default selec-none
                        `}
          >
            <Text
              as="div"
              variant="muted"
              className="flex items-center justify-end"
            >
              {operation}
            </Text>
            <div className="flex items-center justify-between ">
              <Text variant="muted">=</Text>
              <Text variant="blast">{result}</Text>
            </div>
          </div>
        );
      }

      function Calculator() {
        return (
          <Card
            className={`flex flex-col gap-[1.625rem] w-[22.25rem] 
                    pt-14 px-8 pb-8`}
          >
            <CalculatorDisplay operation={"1 + 1"} result={"2"} />

            <div className="flex flex-col gap-3">
              <div className="flex gap-3">
                <Button className="w-16 h-16">CE</Button>
              </div>
            </div>
          </Card>
        );
      }

      function OperationHistory() {
        return (
          <Card className="py-10 px-8 w-full">
            <Text as="h1" variant="heading" className="mb-4">
              Histórico de Operações
            </Text>
            <ul className="flex flex-col gap-3">
              <Text as="li">1 + 1 = 2</Text>
              <Text as="li">2 + 3 + 1 = 6</Text>
              <Text as="li">2+ 3 = 5</Text>
            </ul>
          </Card>
        );
      }

      function App() {
        return (
          <main
            className={`flex flex-col sm:flex-row py-28 px-4
            items-center sm:items-stretch gap-2 sm:px-10`}
          >
            <Calculator />
            <OperationHistory />
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
