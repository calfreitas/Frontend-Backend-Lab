<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik&display=swap"
      rel="stylesheet"
    />
    <title>Rocketseat - React.js - Fundamentos</title>
    <style>
      body {
        background-color: #ffffff;
      }
    </style>
  </head>
  <body class="bg-linear min-h-screen text-text font-sans">
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">

      function Counter() {
        const [counter, setCounter] = React.useState(0);

        if(counter > 20){
          return <p>Maior que 20</p>
        }

        return (
          <>
            <p>Contador: {counter}</p>

            <p>
              {counter > 10 ? 'Maior que 10' : ' Menor ou igual a 10'}
              </p>

              {/* Esse operador abaixo cria um novo paragrafo apartir da condicional */}
              {counter > 15 && <p>Maior que 15</p>} 


            <button onClick={() => setCounter(10)}>Atualizar</button> 
            <button onClick={() => setCounter((prevValue) => prevValue + 1)}>Incrementar</button>
            <button onClick={() => setCounter((prevValue) => prevValue - 1)}>Decrementar</button>
            </>
        );
      };

      function App() {
        return (
          <main>
            <Counter />
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
